<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📝 Create Account</h1>
        <form id="registerForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password (min 6 chars)</label>
                <input type="password" id="password" placeholder="Enter password" required minlength="6">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
            </div>
            <button type="submit">Create Account</button>
            <div id="message"></div>
            <p class="link">Already have an account? <a href="login.html">Login here</a></p>
        </form>
    </div>
    <script>
        const form = document.getElementById('registerForm');
        const messageDiv = document.getElementById('message');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (password !== confirmPassword) {
                messageDiv.innerHTML = '❌ Passwords do not match!';
                messageDiv.className = 'error';
                return;
            }
            try {
                const response = await fetch('http://localhost:3000/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (response.ok) {
                    messageDiv.innerHTML = '✅ ' + data.message;
                    messageDiv.className = 'success';
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    messageDiv.innerHTML = '❌ ' + data.error;
                    messageDiv.className = 'error';
                }
            } catch (error) {
                messageDiv.innerHTML = '❌ Server error. Is the backend running?';
                messageDiv.className = 'error';
            }
        });
    </script>
</body>
</html>
